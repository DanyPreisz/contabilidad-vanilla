<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asientos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div>
        <p class="kicker">Contabilidad</p>
        <h1>Asientos</h1>
      </div>
      <nav class="nav">
        <a href="/">Plan de cuentas</a>
        <a class="on" href="/asientos.html">Asientos</a>
        <a href="/saldos.html">Saldos</a>
        <a href="/esp.html">Situación patrimonial</a>
      </nav>
      <span id="store" class="pill">…</span>
    </header>
    <div class="layout">
      <section class="form-card">
        <h2>Nuevo asiento</h2>
        <form id="form">
          <label>Fecha<input id="date" type="date" required /></label>
          <label>Concepto<input id="concept" required placeholder="Cobro factura, depósito, sueldos…" /></label>
          <table class="lines">
            <thead>
              <tr><th>Cuenta</th><th>Debe</th><th>Haber</th><th></th></tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
          <button type="button" id="add" class="ghost">+ renglón</button>
          <p id="totales" class="totales"></p>
          <div class="actions">
            <button type="submit">Registrar asiento</button>
          </div>
          <p id="msg" class="msg" hidden></p>
        </form>
      </section>
      <section class="tree-card">
        <h2>Libro diario</h2>
        <div id="list"></div>
      </section>
    </div>
    <script src="asientos.js"></script>
  </body>
</html>
