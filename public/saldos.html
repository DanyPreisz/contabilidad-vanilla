<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saldos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div>
        <p class="kicker">Contabilidad</p>
        <h1>Saldos</h1>
      </div>
      <nav class="nav">
        <a href="/">Plan de cuentas</a>
        <a href="/asientos.html">Asientos</a>
        <a class="on" href="/saldos.html">Saldos</a>
      </nav>
      <span id="store" class="pill">…</span>
    </header>
    <div class="layout">
      <section class="form-card">
        <h2>Saldos iniciales</h2>
        <p class="muted">Elegí la subcuenta y cargá el saldo del ejercicio anterior (debe o haber). No hace falta que balancee.</p>
        <form id="form">
          <label>Fecha de saldos<input id="date" type="date" required /></label>
          <label>Subcuenta
            <select id="account">
              <option value="">Elegir subcuenta</option>
            </select>
          </label>
          <div class="actions">
            <label>Debe<input id="debit" type="number" min="0" step="0.01" /></label>
            <label>Haber<input id="credit" type="number" min="0" step="0.01" /></label>
            <button type="button" id="add" class="ghost">Agregar</button>
          </div>
          <table class="lines">
            <thead>
              <tr><th>Subcuenta</th><th>Debe</th><th>Haber</th><th></th></tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
          <p id="totales" class="totales"></p>
          <div class="actions">
            <button type="submit">Guardar saldos iniciales</button>
          </div>
          <p id="msg" class="msg" hidden></p>
        </form>
      </section>
      <section class="tree-card">
        <h2>Saldos actuales</h2>
        <p id="as-of" class="muted"></p>
        <table class="lines">
          <thead>
            <tr><th>Cuenta</th><th>Inicial</th><th>Movimientos</th><th>Saldo</th></tr>
          </thead>
          <tbody id="current"></tbody>
        </table>
      </section>
    </div>
    <script src="saldos.js"></script>
  </body>
</html>
